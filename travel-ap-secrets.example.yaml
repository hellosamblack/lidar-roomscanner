# Copy this to a root-owned file on the Proxmox host, fill in the values, then:
# chmod 0600 /root/travel-ap-secrets.yaml
# sudo ./travel-ap.sh install --secrets /root/travel-ap-secrets.yaml

# The interactive tool lets you choose either profile.  Its selected SSID also
# becomes the protected SSID: it will not start an AP with that name when the
# name is already visible in a scan.
test:
  ssid: Surly_Office_Test
  passphrase: "REPLACE_WITH_A_TEST_WPA2_PASSPHRASE"

production:
  ssid: Surly_Office
  passphrase: "REPLACE_WITH_A_PRODUCTION_WPA2_PASSPHRASE"
