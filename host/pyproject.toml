[project]
name = "roomscan"
version = "0.1.0"
description = "Host-side tools for the roomscanner ToF streamer"
requires-python = ">=3.11,<3.13"  # upper bound: open3d wheel availability
# plyfile: standard INRIA-3DGS PLY reader, used by the splat-vs-scan compare tool
# (roomscan.splat.compare) which is core, not part of the heavy [splat] build extra.
dependencies = ["numpy>=1.26", "pyserial>=3.5", "open3d>=0.18", "psutil>=5.9", "Pillow>=10", "zeroconf>=0.130", "plyfile>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
# Metrics-HUD GPU/VRAM readout via NVML. Optional: without it the panel falls
# back to `nvidia-smi`, then to "GPU n/a" on non-NVIDIA hosts (metrics.py).
monitor = ["nvidia-ml-py>=12"]
# Optional KISS-ICP offline odometry benchmark (roomscan.slam.metrics.compare_kiss).
slam = ["kiss-icp>=1.0"]
# Offline Gaussian-splat reconstruction (roomscan.splat / roomscan-splat).
# COLMAP SfM (pycolmap, CPU) + 3DGS training (torch + gsplat, CUDA). Heavy and
# host-only -- unshippable on the M33, and only needed to BUILD a splat; the web
# server and the light sidecar helpers import none of it. gsplat JIT-compiles its
# CUDA kernels on first use, so a system nvcc + ninja must be on PATH the first
# time a build runs (CUDA_HOME=/usr/local/cuda-<v>); torch bundles its own runtime.
splat = ["torch>=2.4", "gsplat>=1.4", "pycolmap>=4.0", "imageio-ffmpeg>=0.5",
         "transformers>=4.40"]  # transformers: optional monocular-depth prior (Depth-Anything-V2)
         # (plyfile moved to core deps -- the compare tool needs it without this extra)
# Web UI dependencies
# simplejpeg: TurboJPEG-backed encode/decode for /ws-thin's negotiated JPEG
# frame format (#197) -- the CrowPanel thin client's own hardware JPEG block
# decodes it. Degrades gracefully (thin_hello_ack reports format:"raw") if
# unimportable, so it is required here rather than optional-within-optional.
web = ["fastapi", "uvicorn", "websockets", "simplejpeg>=1.9"]
# Agent-facing MCP server (roomscan-mcp). Needs [web] too: the rig_* tools speak
# the same /ws protocol and the ui_* tools drive Chrome over `websockets`.
mcp = ["mcp>=2.0", "playwright>=1.40", "roomscan[web]"]

[project.scripts]
roomscan-view = "roomscan.viewer:main"
roomscan-panel = "roomscan.panel:main"   # DEPRECATED (Web Phase 5): legacy Open3D desktop panel; use roomscan-web
roomscan-ctl = "roomscan.control:main"
roomscan-slam = "roomscan.slam.cli:main"
roomscan-splat = "roomscan.splat.cli:main"   # offline video -> Gaussian-splat reconstruction
roomscan-web = "roomscan.web:main"        # primary UI: browser instrument, headless-capable
roomscan-mcp = "roomscan.mcp_server.__main__:main"  # agent-facing MCP tool server

[tool.pytest.ini_options]
testpaths = ["tests"]
# Resolve `roomscan` from ./src and `tools` from ./ without relying on an
# editable install (matters when running the suite from a git worktree).
pythonpath = ["src", "."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
