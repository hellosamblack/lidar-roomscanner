# roomscan-bridge -- keep the journal across reboots, bounded.
#
# Raspberry Pi OS ships `Storage=volatile`, which spares the SD card by writing
# the journal only to /run/log/journal -- so it is destroyed on every boot.
# (/var/log/journal exists on the stock image, which makes this easy to
# misread as already-persistent; it is simply unused.)
#
# That default is wrong for this box. The bridge's signature failure mode is
# "it stopped being reachable", and the evidence for that lives in the journal
# of the boot that failed. On 2026-08-18 a `systemctl reboot` left the Pi off
# the network entirely -- SSH answered once at `up 0 minutes`, then nothing --
# and recovering it needed a power cycle, which destroyed the only copy of the
# log that could have explained it. The failure is still unexplained (#191).
# A post-mortem you cannot read is not a post-mortem.
#
# Bounded so this does not become the SD card's problem: 64 MB total, 16 MB per
# file, two weeks. The tee's pcap ring is 2 GB by comparison, so this is noise
# next to what the box already writes, and journald enforces the caps itself
# rather than relying on rotation elsewhere.
# SyncIntervalSec is written explicitly rather than left to systemd's
# built-in default (also 5min, as of this writing) -- AGENTS.md's vendor-
# default rule applies to our own upstream too: a value this file does not
# state is a value a future systemd release is free to change without this
# config ever noticing (issue #210). 5 minutes bounds how much of the
# in-RAM journal an abrupt power loss can lose (acceptable -- the point of
# Storage=persistent is the *previous* boots' evidence, not the last few
# minutes of the one that is currently dying) while keeping fsync-driven SD
# writes off the hot path entirely.
[Journal]
Storage=persistent
SystemMaxUse=64M
SystemMaxFileSize=16M
MaxRetentionSec=2week
SyncIntervalSec=5min
