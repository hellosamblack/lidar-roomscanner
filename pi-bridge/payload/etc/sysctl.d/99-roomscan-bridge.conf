# 99-roomscan-bridge.conf -- kernel networking tuning for the roomscan
# Wi-Fi<->eth0 NAT bridge.

# Required for this box to actually route/forward packets between eth0 and
# wlan0 at all -- without it the nftables NAT rules never see any traffic,
# since the kernel drops it before the forward hook.
net.ipv4.ip_forward=1

# Loose reverse-path filtering. Strict (1) rp_filter would drop the
# scanner's stream traffic here: the DNAT path means a packet with the
# scanner's eth0 source address can legitimately need to go back out
# wlan0, an asymmetric path that strict rp_filter treats as spoofed and
# drops. Loose mode (2) only checks that SOME route exists to the source
# address via any interface, which this asymmetric NAT topology satisfies.
net.ipv4.conf.all.rp_filter=2
net.ipv4.conf.default.rp_filter=2
