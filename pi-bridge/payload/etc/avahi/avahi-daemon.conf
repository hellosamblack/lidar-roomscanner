# avahi-daemon.conf -- roomscan bridge Pi.
#
# Based on Debian's stock /etc/avahi/avahi-daemon.conf (avahi-daemon
# package default), with allow-interfaces restricted to wlan0.
#
# allow-interfaces=wlan0
#   Only announce/respond on wlan0. This is deliberate for two reasons:
#     1. The scanner announces its OWN "roomscanner" _roomscan._udp service
#        on eth0 directly; if this Pi also announced on eth0 the two
#        conflicting/duplicate announcements on the same segment would
#        confuse mDNS resolution.
#     2. eth0 is a private point-to-point link to the scanner -- nothing
#        about it (this Pi's presence, the scanner's presence as seen from
#        here) should leak onto the house/travel Wi-Fi via cross-interface
#        announcement.

[server]
use-ipv4=yes
use-ipv6=yes
allow-interfaces=wlan0
#deny-interfaces=
check-response-ttl=no
use-iff-running=no
enable-dbus=yes
disallow-other-stacks=no
allow-point-to-point=no
cache-entries-max=4096
clients-max=4096
objects-per-client-max=1024
entries-per-entry-group-max=32
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=yes

[publish]
# Publish this host's addresses (A/AAAA) and workstation service on wlan0
# so `roomscan-bridge-status`/ssh discovery and general LAN visibility
# work, but keep it scoped by the interface restriction above.
disable-publishing=no
disable-user-service-publishing=no
publish-addresses=yes
publish-hinfo=yes
publish-workstation=yes
publish-domain=yes
#publish-dns-servers=
#publish-resolv-conf-dns-servers=yes
#publish-aaaa-on-ipv4=yes
#publish-a-on-ipv6=no

[reflector]
enable-reflector=no
reflect-ipv=no

[rlimits]
# These are LEFT COMMENTED, exactly as Debian ships them.
#
# They were previously uncommented here, and on the first real Pi
# avahi-daemon crash-looped from first boot (issue #191):
#
#   avahi-daemon[30423]: Service "roomscan-bridge" successfully established.
#   avahi-daemon[30423]: Out of memory, aborting ...
#   systemd[1]: avahi-daemon.service: Main process exited, signal=6/ABRT
#
# every startup cycle, ~1 s in, on a box with 790 MB free. `Out of memory`
# from avahi is its malloc-failure handler, and the malloc was failing
# against an RLIMIT we imposed on it, not against the machine's memory.
#
# The trap is that Debian's stock avahi-daemon.conf ships this whole block
# **commented out** -- the values are upstream's *example*, not the running
# configuration. Copying them into a derived file and removing the `#`
# silently switches on a set of caps that nothing on Debian has ever
# exercised, while the file still reads as "the stock config, plus one
# change". This is the AGENTS.md vendor-default rule in its third costume:
# the surprise is not an #ifndef defaulting ON or an option defaulting OFF,
# but a config block that is inert as shipped and load-bearing once
# uncommented. Read what the vendor actually *applies*, not what its file
# contains.
#
# The fatal line is `rlimit-as=`, WITH AN EMPTY VALUE -- read straight off the
# kernel rather than inferred (2026-08-18, N=5 per arm on the real Pi):
#
#   /proc/<avahi>/limits ->  Max address space   0   0   bytes
#
# avahi parses the empty string as 0 and sets RLIMIT_AS to zero bytes of
# address space. RLIMIT_AS is enforced only against NEW allocations, never
# retroactively, so the daemon starts normally at VmSize ~5 MB, registers its
# records, and then aborts at the first malloc it needs afterwards. That is
# why it presented as "Out of memory" on a box with 790 MB free, and why it
# looked flaky: whether it needs another allocation depends on incoming mDNS
# traffic. The `roomscanner` name conflict with the FileHub-attached scanner
# (runbook §9) is an aggravator, not the cause -- it forces the extra
# allocation, taking the crash rate from 2/5 to 5/5. With the block commented
# it survived 0/10 crashes in BOTH conflict states.
#
# The empty value is the worst case but not the only bad one: an explicit
# generous cap (`rlimit-as=134217728`, 128 MB) still crashed 1/5. Do not cap
# this daemon's address space at all.
#
# Beware bisecting this by hand: the crash is nondeterministic, and a
# single-shot pass over the six limits reported the identical `rlimit-as=`
# config as SURVIVING in one run and CRASHING in the next. Any arm here needs
# repetition and a positive control that the crash still reproduces at all.
#rlimit-as=
#rlimit-core=0
#rlimit-data=4194304
#rlimit-fsize=0
#rlimit-nofile=768
#rlimit-nproc=3
