# roomscan.conf -- global NetworkManager tuning for the roomscan bridge Pi.
#
# Belt-and-suspenders with the per-connection powersave=2 set in each
# wifi profile: this applies wifi.powersave=2 (disabled) globally, so it
# also covers any Wi-Fi connection NetworkManager brings up that is not one
# of our two baked profiles (e.g. a one-off nmcli connection added by an
# operator for debugging). Wi-Fi power saving causes latency spikes and
# occasional stalls that are unacceptable for a low-latency UDP relay.

[connection]
wifi.powersave=2
