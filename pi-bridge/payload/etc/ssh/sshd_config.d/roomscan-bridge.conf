# roomscan-bridge.conf -- point sshd at a root-owned authorized_keys file
# that does not live in a home directory.
#
# Why this exists (first-boot bring-up, 2026-08-18, issue #191):
#
#   install.sh runs from kernel-command-line.target -- very early, before
#   normal boot. The `{{USERNAME}}` account is created LATER, by
#   userconf.txt during that normal boot. So on a first boot install.sh
#   cannot write ~{{USERNAME}}/.ssh/authorized_keys: the home directory,
#   and the account itself, do not exist yet. On the real Pi this fired
#   exactly as predicted:
#
#     install.sh: ERROR: user 'roomscan' does not exist on this system
#     -- cannot install ssh key, remote administration will not work
#
#   The Pi came up fully provisioned and completely unreachable by key,
#   which is the one failure mode that cannot be fixed remotely.
#
#   Rather than order two independent boot-time mechanisms against each
#   other (fragile, and the ordering is not ours to control), the key is
#   installed to /etc/roomscan-bridge/authorized_keys -- a path that
#   exists the moment install.sh writes it, needs no account, and needs no
#   home directory -- and sshd is told to read it. The account can be
#   created whenever userconf.txt gets round to it; by the time anyone can
#   log in as that user, sshd already knows the key.
#
# Scoped to Match User rather than set globally on purpose: a global
# AuthorizedKeysFile would apply to root too, and Debian's default
# `PermitRootLogin prohibit-password` permits *publickey* login -- so a
# global directive would silently grant the bridge key a root shell. It is
# scoped to the one account the bridge is administered through.
#
# The home-directory path is kept as the second entry so a key added later
# by `ssh-copy-id` (the manual recovery path, and how the owner recovered
# this very Pi) keeps working alongside the payload-installed one.
Match User {{USERNAME}}
    AuthorizedKeysFile /etc/roomscan-bridge/authorized_keys .ssh/authorized_keys
