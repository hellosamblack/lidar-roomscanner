# roomscan-bridge.conf -- dnsmasq config for eth0, DHCP-only, for the
# STM32H563 scanner.
#
# port=0
#   Disables dnsmasq's DNS resolver entirely. eth0 is a private
#   point-to-point link to the scanner; nothing on it should be able to
#   resolve names through this box, and running an unneeded resolver on a
#   bridge device is needless attack surface. DHCP service is unaffected
#   by port=0 -- it only turns off the port-53 listener.
interface=eth0
bind-interfaces
port=0

# authoritative
#   Tells dnsmasq it is the only DHCP server on this segment, so it can
#   reply immediately and confidently (NAK stale leases from other
#   servers, answer DHCPREQUEST for out-of-range addresses with NAK
#   instead of silence, etc.) rather than behaving cautiously as if it
#   might be sharing the segment with another DHCP server. This matters
#   directly for the timing requirement below: a non-authoritative server
#   can introduce extra round-trips/delay in edge cases that an
#   authoritative one skips.
dhcp-authoritative

# Why the response-time requirement matters:
#   The STM32H563 scanner firmware runs its own DHCP client with a 3000 ms
#   timeout. If it does not have a bound lease within that window, it gives
#   up on DHCP, self-assigns 172.31.253.1/24, and starts acting as its own
#   DHCP server (see ROADMAP.md's scanner fallback-mode notes). Once that
#   happens the bridge has to detect and route around it
#   (roomscan-bridge-reconcile), which is strictly worse than just
#   answering in time. dnsmasq on a Pi 3 answers in low single-digit
#   milliseconds under normal load, comfortably inside the 3 s window, but
#   the window is why this file exists as a minimal, dedicated,
#   authoritative DHCP-only config rather than a general-purpose dnsmasq
#   setup with extra features that could add latency or failure modes.

# Static lease: the scanner always gets the same address so every other
# piece of this bridge (nftables DNAT target, dnsmasq lease file scraped by
# roomscan-bridge-reconcile and roomscan-bridge-status, documentation) can
# rely on a single fixed address ({{SCANNER_IP}}) instead of doing dynamic
# discovery. The "roomscanner" hostname label below is just the lease's
# DHCP hostname field (cosmetic, shows up in dnsmasq.leases); it is
# intentionally left literal, matching the avahi instance name, rather
# than tokenized.
dhcp-host={{SCANNER_MAC}},{{SCANNER_IP}},roomscanner,infinite

# Range must include the static lease address; dnsmasq requires a
# dhcp-range even when every host is a static dhcp-host entry. Lease time
# is generous since this is a fixed single-device segment. The netmask
# (255.255.255.0) corresponds to {{ETH_PREFIX}}=24 in this network design;
# left as a literal dotted-decimal since no dedicated netmask token exists.
dhcp-range={{DHCP_RANGE_START}},{{DHCP_RANGE_END}},255.255.255.0,12h

# Keep the lease/log noise low but visible enough to debug from the
# journal (`journalctl -u dnsmasq`).
log-dhcp
