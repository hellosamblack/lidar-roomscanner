# Pi bridge node build secrets -- TEMPLATE. Copy, fill in, keep private.
#
#   cp pi-bridge/pi-bridge-secrets.example.yaml ~/.config/roomscan/pi-bridge-secrets.yaml
#   chmod 600 ~/.config/roomscan/pi-bridge-secrets.yaml
#   ./pi-bridge/build_image.py --secrets ~/.config/roomscan/pi-bridge-secrets.yaml
#
# The builder REFUSES this file by path (its placeholders would produce an image
# that never associates, with no error until the Pi is already on the rig) and
# refuses any secrets file that is group- or world-readable. It holds a Wi-Fi
# PSK and a login password in plain text.
#
# Same pattern as travel-ap-secrets.example.yaml: the example is committed, the
# real file lives outside the repo (and pi-bridge-secrets.yaml is git-ignored
# here as a second line of defence).

# The Pi's hostname. Also seeds the deterministic NetworkManager profile UUIDs,
# so changing it changes them -- keep it stable once a card is in the field.
hostname: roomscan-bridge

# Login account created on first boot (userconf.txt). This is also the account
# the ssh key is installed for and the account the MCP bridge_* tools use, so
# it must match $ROOMSCAN_BRIDGE_USER if you set that.
username: roomscan
password: CHANGEME-a-real-password

# ISO 3166-1 alpha-2. Not optional: on several Raspberry Pi OS images the 2.4 GHz
# radio stays soft-blocked until a regulatory domain is set, which presents as
# "Wi-Fi just doesn't work" with no error anywhere.
wifi_country: US

wifi:
  home:
    ssid: Surly_Office
    passphrase: CHANGEME-home-psk
    # Higher wins when both networks are in range.
    priority: 50
  # Optional. Omit the whole block if you have no travel AP; the builder then
  # bakes a disabled placeholder rather than leaving a template unresolved.
  # This is the AP from docs/superpowers/plans/2026-08-03-travel-mode.md --
  # travel-ap.sh needs no changes for the Pi, it does not care who associates.
  travel:
    ssid: roomscanner-travel
    passphrase: CHANGEME-travel-psk
    priority: 10
